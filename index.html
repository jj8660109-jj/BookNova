<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNova - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 390px;
            background: white;
            padding: 35px 32px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .book-logo {
            width: 60px;
            height: 45px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1565C0;
            font-size: 42px;
        }

        .logo h1 {
            color: #1565C0;
            font-size: 29px;
            margin-top: 8px;
        }

        .logo p {
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        /* Login heading */
        .login-title {
            font-size: 24px;
            color: #263238;
            margin-bottom: 22px;
        }

        /* Input */
        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            padding: 0 45px 0 14px;
            border: 1px solid #d8dee6;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .input-box input:focus {
            border-color: #1565C0;
        }

        /* Eye */
        .eye {
            position: absolute;
            right: 14px;
            top: 13px;
            cursor: pointer;
            color: #777;
            font-size: 18px;
        }

        /* Forgot */
        .forgot {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #1565C0;
            font-size: 13px;
            text-decoration: none;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #1565C0;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0d57a7;
        }

        /* Message */
        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        /* OR */
        .or {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #888;
            font-size: 13px;
        }

        .line {
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        /* Google */
        .google-btn {
            width: 100%;
            height: 46px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .google-btn:hover {
            background: #f7f7f7;
        }

        .google {
            font-weight: bold;
            color: #4285F4;
            font-size: 18px;
            margin-right: 8px;
        }

        /* Register */
        .register {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #666;
        }

        .register a {
            color: #1565C0;
            text-decoration: none;
            font-weight: bold;
        }

        /* Mobile */
        @media (max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- BookNova Logo -->
        <div class="logo">

            <div class="book-logo">📖</div>

            <h1>BookNova</h1>

            <p>Smart Library Management System</p>

        </div>


        <!-- Login -->
        <h2 class="login-title">Login</h2>


        <!-- Email -->
        <div class="input-group">

            <label>Email / Username</label>

            <div class="input-box">

                <input
                    type="text"
                    id="email"
                    placeholder="Enter email or username"
                >

            </div>

        </div>


        <!-- Password -->
        <div class="input-group">

            <label>Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

                <span
                    class="eye"
                    onclick="togglePassword()"
                >👁</span>

            </div>

        </div>


        <!-- Forgot Password -->
        <div class="forgot">

            <a href="#" onclick="forgotPassword()">
                Forgot Password?
            </a>

        </div>


        <!-- Login -->
        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>


        <p id="message"></p>


        <!-- OR -->
        <div class="or">

            <div class="line"></div>

            <span>OR</span>

            <div class="line"></div>

        </div>


        <!-- Google -->
        <button
            class="google-btn"
            onclick="googleLogin()"
        >

            <span class="google">G</span>
            Continue with Google

        </button>


        <!-- Register -->
        <div class="register">

            Don't have an account?

            <a href="#" onclick="register()">
                Register
            </a>

        </div>

    </div>


    <script>

        // Show / Hide Password
        function togglePassword() {

            let password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }
        }


        // Login
        function login() {

            let email =
                document.getElementById("email").value.trim();

            let password =
                document.getElementById("password").value.trim();

            let message =
                document.getElementById("message");


            if (email === "" || password === "") {

                message.style.color = "red";

                message.innerHTML =
                    "Please enter Email and Password.";

                return;
            }


            // Demo Login Details
            if (
                email === "admin@gmail.com" &&
                password === "12345"
            ) {

                message.style.color = "green";

                message.innerHTML =
                    "Login Successful ✓";

            } else {

                message.style.color = "red";

                message.innerHTML =
                    "Invalid Email or Password.";

            }
        }


        // Forgot Password
        function forgotPassword() {

            alert("Password reset option will be available soon.");

        }


        // Google Login
        function googleLogin() {

            alert("Google Login clicked.");

        }


        // Register
        function register() {

            alert("Registration page will be added later.");

        }

    </script>

</body>
</html>
